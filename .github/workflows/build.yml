# Builds and tests on all three systems. The packages are attached to the run.
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools xvfb openbox imagemagick dbus-daemon
      - run: cargo test --target x86_64-unknown-linux-musl --bin pixel-pet
      - run: dbus-run-session -- cargo test --target x86_64-unknown-linux-musl --bin pixel-pet on_a_real_bus -- --ignored
      - run: sh scripts/package-linux.sh
      - name: start it on a screen and look
        run: |
          mkdir -p shots cfg
          printf 'intro=1\nfacts=0\nai=0\npet=0\nwalk=0\ntricks=0\ntalk=0\nx=200\ny=400\n' > cfg/pixel-pet.cfg
          export APPDATA="$PWD/cfg" DISPLAY=:9
          Xvfb :9 -screen 0 1280x800x24 & sleep 2; openbox & sleep 1
          target/x86_64-unknown-linux-musl/release/pixel-pet & sleep 6
          import -window root shots/linux.png
          pgrep -x pixel-pet
          target/x86_64-unknown-linux-musl/release/pixel-pet --toggle; sleep 2
          if pgrep -x pixel-pet; then echo 'it is still there'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux, path: "target/package/*.tar.gz\nshots/" }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --bin pixel-pet
      # Only where the secrets are, and never for pull requests from elsewhere. Without them the app is
      # signed for one Mac only.
      - name: bring in the Developer ID
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          [ -n "$P12" ] || { echo "no certificate, so no signature"; exit 0; }
          k="$RUNNER_TEMP/sign.keychain-db"; pw=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/c.p12"
          security create-keychain -p "$pw" "$k"
          security set-keychain-settings -lut 3600 "$k"
          security unlock-keychain -p "$pw" "$k"
          security import "$RUNNER_TEMP/c.p12" -k "$k" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$k" > /dev/null
          security list-keychains -d user -s "$k" login.keychain-db
          rm "$RUNNER_TEMP/c.p12"
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER=$ISSUER" >> "$GITHUB_ENV"
          fi
      - run: sh scripts/package-macos.sh
      - name: take the Developer ID away again
        if: always()
        run: |
          [ ! -e "$RUNNER_TEMP/sign.keychain-db" ] || security delete-keychain "$RUNNER_TEMP/sign.keychain-db"
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: start it on a screen and look
        run: |
          mkdir -p shots cfg
          printf 'intro=1\nfacts=0\nai=0\npet=0\nsize=0\nwalk=0\ntricks=0\ntalk=0\nx=200\ny=300\n' > cfg/pixel-pet.cfg
          export APPDATA="$PWD/cfg"
          "target/package/Pixel Pet.app/Contents/MacOS/pixel-pet" > shots/log.txt 2>&1 & sleep 8
          pgrep -x pixel-pet || { cat shots/log.txt; exit 1; }
          screencapture -x shots/macos.png || true
          # its hub, with a right click on it; a machine may not allow that
          swift - <<'END' || true
          import CoreGraphics
          import Foundation
          let p = CGPoint(x: 180, y: 660)
          for t in [CGEventType.mouseMoved, .rightMouseDown, .rightMouseUp] {
              CGEvent(mouseEventSource: nil, mouseType: t, mouseCursorPosition: p, mouseButton: .right)?.post(tap: .cghidEventTap)
              Thread.sleep(forTimeInterval: 0.4)
          }
          END
          sleep 2; screencapture -x shots/macos-hub.png || true
          "target/package/Pixel Pet.app/Contents/MacOS/pixel-pet" --toggle; sleep 3
          cat shots/log.txt
          if pgrep -x pixel-pet; then echo 'it is still there'; exit 1; fi
          if grep -i panick shots/log.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: macos, path: "target/package/*.zip\nshots/" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --bin pixel-pet
      # build.rs puts the icon in with the SDK's resource compiler, which is not on the path
      - name: find rc.exe
        shell: pwsh
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $rc) { echo "no rc.exe: the exe will have no icon"; exit 0 }
          $rc.DirectoryName >> $env:GITHUB_PATH
          # its headers (winver.h), and the icon beside the .rc
          $ver = $rc.Directory.Parent.Name
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$ver"
          "INCLUDE=$inc\um;$inc\shared;$((Get-Location).Path)\assets" >> $env:GITHUB_ENV
      - name: build and zip it as scripts/package.ps1 does
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$((Get-Location).Path)=."
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes("target\release\pixel-pet.exe"))
          if (-not $t.Contains("VS_VERSION_INFO")) { echo "::warning::the exe has no icon" }
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $stage = "target\package\PixelPet-$version"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\pixel-pet.exe $stage
          Copy-Item assets\README.txt $stage
          Copy-Item NOTICE.md "$stage\NOTICE.txt"
          Copy-Item LICENSE "$stage\LICENSE.txt"
          Copy-Item LICENSE-ART.md "$stage\LICENSE-ART.txt"
          Compress-Archive -Path "$stage\*" -DestinationPath "target\package\PixelPet-$version-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "target/package/*.zip" }
